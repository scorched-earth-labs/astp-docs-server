[project]
name = "astp-docs-server"
version = "0.1.0"
description = "Open documentation server for ASTP (AI State Tree Protocol) — MCP transport for coding agents + web-chat head, over the public protocol corpus"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt", "NOTICE"]
requires-python = ">=3.10"
authors = [
    { name = "Scorched Earth Labs", email = "dev@scorchedearthlabs.com" },
]
keywords = ["astp", "mcp", "documentation", "specification", "protocol", "retrieval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Documentation",
]

dependencies = [
    # The retrieval engine + shared tool logic. [embeddings] pulls numpy for
    # vector search, which every transport uses.
    "astp-docs[embeddings]",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# The MCP transport (FastMCP), for adopters' coding agents. Kept out of the base
# deps so the web head can deploy without the MCP SDK.
mcp = ["mcp>=1.0.0,<2"]
# The web-chat head. anthropic powers the default Claude generator; the endpoint
# also runs keyless via the extractive fallback.
web = ["fastapi>=0.110", "uvicorn>=0.27", "anthropic>=0.40"]
dev = ["pytest>=7.0.0", "httpx>=0.27", "mcp>=1.0.0,<2"]

[project.scripts]
astp-docs-open = "astp_docs_server.mcp_server:run"
astp-docs-web = "astp_docs_server.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The vendored open-docs snapshot (src/astp_docs_server/corpus/**) ships
# automatically as package data — it lives inside the package dir. Populate it
# with `python scripts/vendor_corpus.py` before building the wheel/Docker image.
packages = ["src/astp_docs_server"]

[project.urls]
Homepage = "https://github.com/scorched-earth-labs/astp-docs-server"
Repository = "https://github.com/scorched-earth-labs/astp-docs-server"
Issues = "https://github.com/scorched-earth-labs/astp-docs-server/issues"
"ASTP protocol" = "https://github.com/scorched-earth-labs/astp"
"Retrieval core" = "https://github.com/scorched-earth-labs/astp-docs-core"
